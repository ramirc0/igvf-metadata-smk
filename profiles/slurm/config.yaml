executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10
# NODE_FAIL nodes join this list. An --exclude in slurm_extra would override it.
# slurm-exclude-failed-nodes: node1,node2   # e.g. nodes missing a shared mount

resources:                  # cap concurrent requests to the IGVF API
  igvf_api: 4

default-resources:
  slurm_account: ramirezc
  slurm_partition: 12hours
  runtime: 60m
  mem_mb: 4096

set-resources:              # tune from benchmarks/ TSVs after a real run
  fetch_report:
    mem_mb: 4096 * attempt
    runtime: 60m
  report_parquet:
    mem_mb: 8192 * attempt
    runtime: 60m

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
